<div class="crypto-container max-w-4xl mx-auto p-6 bg-gray-900 text-white rounded-2xl shadow-lg">
  <h1 class="text-3xl font-bold text-center mb-6">Crypto Trading</h1>

  <!-- === Zone de contrôle === -->
  <div class="controls grid grid-cols-1 md:grid-cols-2 gap-4 mb-6 bg-gray-800 p-4 rounded-lg">
    <div>
      <label class="block text-sm font-medium mb-1">Crypto :</label>
      <select
        [(ngModel)]="selectedSymbol"
        (change)="loadPrice()"
        class="w-full p-2 rounded bg-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
      >
        <option *ngFor="let s of symbols" [value]="s">{{ s }}</option>
      </select>
    </div>

    <div class="flex flex-col justify-center">
      <p class="text-sm text-gray-300">
        Prix actuel : <strong class="text-green-400">{{ price || 'Chargement...' }}</strong>
      </p>
    </div>

    <div>
      <label class="block text-sm font-medium mb-1">Quantité :</label>
      <input
        type="number"
        [(ngModel)]="amount"
        min="0.001"
        step="0.001"
        class="w-full p-2 rounded bg-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
    </div>

    <div>
      <label class="block text-sm font-medium mb-1">Type :</label>
      <select
        [(ngModel)]="side"
        class="w-full p-2 rounded bg-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
      >
        <option value="BUY">Achat</option>
        <option value="SELL">Vente</option>
      </select>
    </div>

    <div class="md:col-span-2 text-center mt-3">
      <button
        (click)="executeTrade()"
        class="bg-blue-600 hover:bg-blue-700 px-6 py-2 rounded font-semibold transition"
      >
        Exécuter la transaction
      </button>
    </div>
  </div>

  <!-- === Historique des transactions === -->
  <h2 class="text-2xl font-semibold mb-3">Historique des transactions</h2>
  <div class="overflow-x-auto">
    <table class="w-full border-collapse bg-gray-800 rounded-lg">
      <thead>
        <tr class="bg-gray-700 text-left text-sm uppercase text-gray-300">
          <th class="p-2">Heure</th>
          <th class="p-2">Symbole</th>
          <th class="p-2">Type</th>
          <th class="p-2">Quantité</th>
          <th class="p-2">Prix</th>
          <th class="p-2">Total</th>
        </tr>
      </thead>
      <tbody>
        <tr
          *ngFor="let t of trades"
          class="border-t border-gray-600 hover:bg-gray-700 transition"
        >
          <td class="p-2 text-gray-300">{{ t.time }}</td>
          <td class="p-2">{{ t.symbol }}</td>
          <td
            class="p-2 font-semibold"
            [ngClass]="{ 'text-green-400': t.side === 'BUY', 'text-red-400': t.side === 'SELL' }"
          >
            {{ t.side }}
          </td>
          <td class="p-2">{{ t.amount }}</td>
          <td class="p-2">{{ t.price | number: '1.2-2' }}</td>
          <td class="p-2">{{ t.total | number: '1.2-2' }}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- === Bouton retour === -->

<!-- === Graphique Bougies Japonaises === -->
<div #chartContainer class="w-full h-[400px] bg-gray-900 rounded-lg border border-gray-700"></div>
  <div class="text-center mt-6">
    <button
      routerLink="/"
      class="bg-gray-600 hover:bg-gray-700 px-4 py-2 rounded transition"
    >
      ← Retour au Dashboard
    </button>
  </div>
</div>
